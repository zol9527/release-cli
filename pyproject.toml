[project]
name = "release-cli"
version = "0.2.1"
description = "轻量级自动化发布工具"
authors = [{ name = "loyd", email = "loyd@example.com" }]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["release", "deploy", "automation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/zol9527/release-cli"
Repository = "https://github.com/zol9527/release-cli"
Documentation = "https://github.com/zol9527/release-cli#readme"
Issues = "https://github.com/zol9527/release-cli/issues"

[project.scripts]
release-cli = "release_cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/release_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/release_cli",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TC", "RUF"]
ignore = ["E501", "TRY003"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
