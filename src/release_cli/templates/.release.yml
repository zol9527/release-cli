# =============================================================================
# Release Cli 配置
# =============================================================================
# 完整配置参考: https://github.com/zol9527/release-cli
# =============================================================================

# -----------------------------------------------------------------------------
# 版本管理
# -----------------------------------------------------------------------------
version:
  # 版本来源:
  # file    -> 从 VERSION 文件读取
  # git-tag -> 从最近的 Git tag 读取
  source: 'file'

  # Git tag 前缀。monorepo 可以用 backend/v, wechat/v 隔离不同发布单元。
  tag_prefix: 'v'

  # VERSION 文件路径（source 为 file 时有效）
  file: _state/VERSION

  # 写入版本后执行的 Hook 脚本
  # release-cli 会把一个 payload.json 的路径作为唯一参数传给它
  # 你只需要在 Hook 模板里的 apply_version_update(context) 中补自己的业务逻辑
  hook: _shared/version-hook.py

# -----------------------------------------------------------------------------
# 变更日志配置
# -----------------------------------------------------------------------------
changelog:
  # changelog 输出目录，默认相对 packager.root_dir 生成 docs/changes/<日期>-v<版本>.md
  output_dir: docs/changes

# -----------------------------------------------------------------------------
# 提交过滤配置
# -----------------------------------------------------------------------------
filter:
  # 忽略的提交消息（支持正则表达式）
  ignore_messages:
    - "^docs:.*"
    - "^chore:.*"
    - "^style:.*"
    - ".*WIP.*"
    - ".*merge.*"
    - "^Revert.*"

  # 保留的提交类型（白名单）
  keep_types:
    - feat
    - fix
    - perf
    - refactor
    - security

# -----------------------------------------------------------------------------
# 发布流水线配置
# -----------------------------------------------------------------------------
release:
  # release-cli release 会按这些阶段执行
  steps:
    - preflight
    - prepare
    - commit
    - pr

  # 允许执行发布的分支正则。空列表表示不限制。
  allowed_branches: []

  # commit 阶段是否自动暂存版本文件、changelog 和常见业务版本文件。
  auto_stage: true

  # pr 阶段默认关闭，需要时可在命令传 --create-pr 或改成 true。
  create_pr: false
  push: false
  base_branch: release

  # 阶段 hook 示例:
  # hooks:
  #   before-prepare:
  #     - "echo preparing $RELEASE_TAG"
  hooks: {}

# -----------------------------------------------------------------------------
# 可选 Python workflow
# -----------------------------------------------------------------------------
workflow:
  release:
    # 如果启用这个脚本，release-cli release 会执行其中的 @step 函数。
    # 每个 @step 内可以调用 ctx.builtin() 复用内置逻辑，也可以写定制逻辑。
    script: _shared/workflows/release.py

# -----------------------------------------------------------------------------
# 打包配置
# -----------------------------------------------------------------------------
packager:
  # 项目根目录。配置文件位于 .release/ 下，所以这里默认指向上一层项目根。
  root_dir: ..

  # 输出目录
  output_dir: release

  # 输出文件名模板（最终会自动追加 .zip）
  name: "{name}-{version}"

  # 需要打包的文件/目录
  include:
    - src
    - package.json
    - pyproject.toml
    - .release/_state/VERSION

  # 不需要打进 zip 的文件或目录
  exclude:
    - .git
    - .github
    - .beads
    - __pycache__
    - .venv
    - node_modules
    - release
